<!-- Geração de .xlsx (opcional). Se não carregar, a exportação cai para CSV automaticamente. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" onerror="window.__semXLSX=1"></script>
<style>
:root{
  --brand:#4338ca; --brand-600:#4f46e5; --brand-50:#eef2ff; --brand-100:#e0e7ff;
  --ink:#0f172a; --ink-2:#334155; --mute:#64748b; --mute-2:#94a3b8;
  --line:#e2e8f0; --line-2:#cbd5e1; --bg:#f6f7fb; --card:#ffffff;
  --green:#059669; --green-bg:#ecfdf5; --red:#dc2626; --red-bg:#fef2f2;
  --amber:#d97706; --amber-bg:#fffbeb; --blue:#0284c7; --blue-bg:#f0f9ff;
  --violet:#7c3aed; --violet-bg:#f5f3ff;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  /* Marca ESSENZA AURA */
  --marca-preto:#0d0d0d; --marca-ouro:#b08a52; --marca-ouro-claro:#d4b083;
  --sh:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
  --sh-lg:0 10px 30px -8px rgba(15,23,42,.18);
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--brand);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ══ LOGIN ══ */
#login{position:fixed;inset:0;display:grid;place-items:center;background:
  radial-gradient(ellipse 100% 70% at 50% 0%,#ede9fe,transparent 70%),var(--bg);z-index:200}
.login-card{width:min(400px,92vw);background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:38px 34px;box-shadow:var(--sh-lg)}
.login-card{text-align:left}
.login-card .logo-marca{display:block;width:170px;margin:0 auto 20px;border-radius:10px}
.login-card p.sub{color:var(--mute);font-size:13.5px;margin-bottom:26px;text-align:center}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;background:#fff;
  transition:border-color .15s,box-shadow .15s;font-size:14px}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.inp:disabled{background:#f8fafc;color:var(--mute)}
textarea.inp{resize:vertical;min-height:64px}
.btn{border:1px solid transparent;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13.5px;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center;
  transition:background .15s,border-color .15s,opacity .15s;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-p{background:var(--brand);color:#fff}.btn-p:hover:not(:disabled){background:var(--brand-600)}
.btn-s{background:#fff;border-color:var(--line-2);color:var(--ink-2)}.btn-s:hover:not(:disabled){background:#f8fafc;border-color:var(--mute-2)}
.btn-d{background:var(--red);color:#fff}.btn-d:hover:not(:disabled){background:#b91c1c}
.btn-g{background:var(--green);color:#fff}.btn-g:hover:not(:disabled){background:#047857}
.btn-ghost{background:transparent;color:var(--mute)}.btn-ghost:hover{background:#f1f5f9;color:var(--ink)}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-block{width:100%}
.err{background:var(--red-bg);border:1px solid #fecaca;color:#991b1b;padding:10px 13px;
  border-radius:8px;font-size:13px;margin-bottom:15px}

/* ══ SHELL ══ */
#app{display:none;min-height:100vh}
#app.on{display:block}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:236px;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:60;transition:transform .25s}
.sb-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sb-head .mark{width:36px;height:36px;border-radius:8px;flex:0 0 auto;object-fit:cover}
.sb-head .nm{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.09em;line-height:1.1;
  color:var(--marca-preto)}
.sb-head .sb{font-size:8.5px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;
  margin-top:3px;line-height:1.35}
.sb-nav{flex:1;overflow-y:auto;padding:12px 10px 20px}
.sb-grp{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute-2);
  padding:14px 10px 6px}
.sb-nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);
  font-size:13.5px;font-weight:500;margin-bottom:1px;transition:background .12s,color .12s}
.sb-nav a:hover{background:#f1f5f9;color:var(--ink)}
.sb-nav a.on{background:var(--brand-50);color:var(--brand);font-weight:600}
.sb-nav a .ic{width:17px;text-align:center;flex:0 0 auto;opacity:.85}
.sb-nav a .bdg{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;
  padding:1px 6px;border-radius:9px;font-family:var(--mono)}
.sb-foot{border-top:1px solid var(--line);padding:11px 14px;display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand-100);color:var(--brand);
  display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 auto}
.sb-foot .u{flex:1;min-width:0}
.sb-foot .u b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-foot .u span{font-size:11px;color:var(--mute)}

.main{margin-left:236px;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:0 24px;height:56px;display:flex;align-items:center;gap:14px;z-index:40}
.topbar .crumb{font-size:13px;color:var(--mute);flex:1;min-width:0}
.topbar .crumb b{color:var(--ink);font-weight:600}
.menu-btn{display:none;background:none;border:none;font-size:19px;cursor:pointer;color:var(--ink-2);padding:4px}
.tb-user{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.tb-user .nm{font-size:12.5px;color:var(--mute);max-width:170px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
@media(max-width:860px){.tb-user .nm{display:none}}
.search-glob{position:relative;width:270px}
.search-glob input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 11px 7px 32px;
  background:#f8fafc;font-size:13px}
.search-glob input:focus{outline:none;background:#fff;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.search-glob .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mute-2);font-size:13px}
.gres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--sh-lg);max-height:340px;overflow-y:auto;display:none;z-index:50}
/* Lista de sugestões flutuante: presa ao <body> e com position:fixed para não
   ser recortada por nenhum contêiner com overflow (as tabelas de itens usam
   overflow-x:auto, o que escondia a lista dentro do formulário). */
.gres.flut{position:fixed;top:auto;left:auto;right:auto;z-index:180;max-height:300px;min-width:250px}
.gres .criar{background:var(--brand-50);color:var(--brand);font-weight:600;border-top:1px solid var(--line)}
.gres .criar:hover{background:var(--brand-100)}
.gres .vazio{color:var(--mute);cursor:default}
.gres.on{display:block}
.gres a{display:block;padding:9px 13px;border-bottom:1px solid #f1f5f9;color:var(--ink);font-size:13px}
.gres a:last-child{border-bottom:none}
.gres a:hover{background:var(--brand-50)}
.gres .t{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

.content{flex:1;padding:24px;max-width:1500px;width:100%}
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:170px}
.page-head h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:3px;letter-spacing:0}
.page-head .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ══ CARDS / KPI ══ */
.kpis{display:grid;gap:12px;margin-bottom:20px}
.k5{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.k4{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.k3{grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--sh)}
.kpi .lab{font-size:11.5px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;
  margin-bottom:7px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:22px;font-weight:700;letter-spacing:-.02em;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--mute);margin-top:4px}
.kpi.green .val{color:var(--green)} .kpi.red .val{color:var(--red)}
.kpi.amber .val{color:var(--amber)} .kpi.blue .val{color:var(--blue)}
.kpi.violet .val{color:var(--violet)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px;overflow:hidden}
.card-h{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.card-h h3{font-size:14.5px;font-weight:700;flex:1;min-width:130px;letter-spacing:-.01em}
.card-b{padding:17px}
.card-b.flush{padding:0}

/* ══ TABLE ══ */
.tw{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{text-align:left;padding:10px 13px;font-size:11px;font-weight:700;color:var(--mute);
  text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);white-space:nowrap;
  background:#fbfcfe;position:sticky;top:0;z-index:1}
table.dt td{padding:11px 13px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
table.dt tbody tr:hover{background:#fafbff}
table.dt tbody tr:last-child td{border-bottom:none}
table.dt .r{text-align:right}
table.dt .c{text-align:center}
table.dt .nw{white-space:nowrap}
.empty{padding:48px 20px;text-align:center;color:var(--mute)}
.empty .ic{font-size:34px;margin-bottom:10px;opacity:.35}
.empty h4{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.empty p{font-size:13px;margin-bottom:16px}

.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.g{background:var(--green-bg);color:var(--green)}
.tag.r{background:var(--red-bg);color:var(--red)}
.tag.a{background:var(--amber-bg);color:var(--amber)}
.tag.b{background:var(--blue-bg);color:var(--blue)}
.tag.v{background:var(--violet-bg);color:var(--violet)}
.tag.n{background:#f1f5f9;color:var(--mute)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}

.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:13px 17px;border-bottom:1px solid var(--line);background:#fbfcfe}
.filters .inp{width:auto;min-width:130px;padding:7px 10px;font-size:13px}
.filters .grow{flex:1;min-width:180px}
.pager{display:flex;align-items:center;gap:11px;padding:11px 17px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.pager .sp{flex:1}

/* ══ FORM ══ */
.grid-f{display:grid;gap:14px}
.f2{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.f3{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.f4{grid-template-columns:repeat(auto-fit,minmax(125px,1fr))}
.hint{font-size:11.5px;color:var(--mute);margin-top:4px}
.hint.warn{color:var(--amber);font-weight:600}
.hint.bad{color:var(--red);font-weight:600}
.sec-t{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);
  margin:22px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.sec-t:first-child{margin-top:0}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;user-select:none}
.chk input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}

/* ══ MODAL ══ */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:26px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:min(720px,100%);box-shadow:var(--sh-lg);
  animation:pop .2s cubic-bezier(.2,.8,.3,1);margin:auto}
.modal.wide{width:min(1080px,100%)}
.modal.narrow{width:min(440px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
.modal-h{padding:17px 21px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.modal-h h3{font-size:16.5px;font-weight:700;flex:1;letter-spacing:-.01em}
.modal-h .x{background:none;border:none;font-size:20px;cursor:pointer;color:var(--mute-2);line-height:1;padding:2px 6px}
.modal-h .x:hover{color:var(--ink)}
.modal-b{padding:21px;max-height:calc(100vh - 210px);overflow-y:auto}
.modal-f{padding:15px 21px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;
  flex-wrap:wrap;background:#fbfcfe;border-radius:0 0 14px 14px}
.modal-f .sp{flex:1}

/* ══ TOAST ══ */
#toasts{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:9px;max-width:min(400px,92vw)}
.toast{background:#fff;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:9px;
  padding:12px 15px;box-shadow:var(--sh-lg);animation:slide .25s;font-size:13.5px}
.toast.ok{border-left-color:var(--green)} .toast.bad{border-left-color:var(--red)} .toast.warn{border-left-color:var(--amber)}
.toast b{display:block;font-weight:700;margin-bottom:2px;font-size:13.5px}
.toast span{color:var(--mute);font-size:12.5px}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* ══ MISC ══ */
.spin{width:17px;height:17px;border:2px solid var(--line-2);border-top-color:var(--brand);
  border-radius:50%;animation:sp .65s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:56px;text-align:center;color:var(--mute)}
.skel{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;
  animation:shm 1.3s infinite;border-radius:6px;height:15px}
@keyframes shm{0%{background-position:200% 0}100%{background-position:-200% 0}}
.bar{height:6px;background:#f1f5f9;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--green)} .neg{color:var(--red)}
.thumb{width:34px;height:34px;border-radius:7px;object-fit:cover;background:#f1f5f9;flex:0 0 auto}
.pnome{display:flex;align-items:center;gap:9px;min-width:0}
.pnome .ph{width:34px;height:34px;border-radius:7px;background:var(--marca-preto);display:grid;place-items:center;
  font-size:13px;color:var(--marca-ouro-claro);font-family:var(--serif);font-weight:600;flex:0 0 auto}
.pnome b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnome span{font-size:11.5px;color:var(--mute);font-family:var(--mono)}
.alert{padding:12px 15px;border-radius:9px;font-size:13px;margin-bottom:15px;display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:var(--amber-bg);border:1px solid #fde68a;color:#92400e}
.alert.bad{background:var(--red-bg);border:1px solid #fecaca;color:#991b1b}
.alert.info{background:var(--blue-bg);border:1px solid #bae6fd;color:#075985}
.alert.ok{background:var(--green-bg);border:1px solid #a7f3d0;color:#065f46}
.alert b{font-weight:700}
.sumbox{background:#fbfcfe;border:1px solid var(--line);border-radius:9px;padding:15px}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13.5px}
.sumrow.tot{border-top:1px solid var(--line-2);margin-top:7px;padding-top:11px;font-weight:700;font-size:15.5px}
.sumrow .l{color:var(--mute)} .sumrow.tot .l{color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:17px;overflow-x:auto}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:9px 14px;
  font-size:13.5px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.chart{width:100%;height:230px}
.lgd{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:9px;justify-content:center}
.lgd i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
.rank{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #f1f5f9}
.rank:last-child{border-bottom:none}
.rank .pos-n{width:22px;height:22px;border-radius:6px;background:#f1f5f9;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--mute);flex:0 0 auto}
.rank .pos-n.top{background:var(--brand);color:#fff}
.rank .info{flex:1;min-width:0}
.rank .info b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .info span{font-size:11.5px;color:var(--mute)}
.itens-tb{width:100%;border-collapse:collapse;font-size:13px}
.itens-tb th{text-align:left;padding:7px 9px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--mute);font-weight:700;border-bottom:1px solid var(--line)}
.itens-tb td{padding:6px 9px;border-bottom:1px solid #f1f5f9}
.itens-tb .inp{padding:6px 8px;font-size:13px}
.itens-tb tfoot td{border-bottom:none;padding-top:11px;font-weight:700}

@media(max-width:1000px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:var(--sh-lg)}
  .main{margin-left:0}
  .menu-btn{display:block}
  .search-glob{width:auto;flex:1;max-width:230px}
  .content{padding:16px}
}
@media(max-width:640px){
  .kpi .val{font-size:19px}
  .modal-b{padding:16px}
  .topbar{padding:0 14px}
  .topbar .crumb{display:none}
}

/* ══ IMPRESSÃO / PDF ══ */
#printarea{display:none}
@media print{
  @page{size:A4;margin:11mm}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  body{background:#fff}
  #app,#login,#toasts,.ov{display:none !important}
  #printarea{display:block !important}
  .doc{page-break-after:always}
  .doc:last-child{page-break-after:auto}
}
/* ══ DOCUMENTOS IMPRESSOS — identidade ESSENZA AURA ══ */
.doc{font-family:var(--sans);color:#16130f;font-size:11px;max-width:186mm;margin:0 auto;line-height:1.5}

.doc .dh{display:flex;align-items:stretch;gap:10mm;padding-bottom:6mm;margin-bottom:7mm;
  border-bottom:2.5px solid var(--marca-preto)}
.doc .dh .co{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.doc .dh .co .marca{width:46mm;display:block;border-radius:2mm}
.doc .dh .co p{font-size:9.5px;color:#5a5348;line-height:1.55;margin-top:3mm}
.doc .dh .no{text-align:right;flex:0 0 auto;padding-left:8mm;border-left:1px solid #d8d0c4;align-self:stretch;
  display:flex;flex-direction:column;justify-content:center}
.doc .dh .no h3{font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--marca-preto);line-height:1.2}
.doc .dh .no .num{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--marca-ouro);margin-top:1.5mm}
.doc .dh .no .dt{font-size:9.5px;color:#5a5348;margin-top:1mm}
.doc .dh .no .et{display:inline-block;margin-top:2mm;font-size:7.5px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700;border:1px solid var(--marca-ouro);color:var(--marca-ouro);
  padding:1mm 2.5mm;border-radius:1mm}

.doc h4{font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--marca-ouro);
  margin:6mm 0 2mm;display:flex;align-items:center;gap:3mm}
.doc h4::after{content:'';flex:1;height:1px;background:#e2dbcf}
.doc h4:first-of-type{margin-top:0}

.doc .pessoa{background:#faf8f4;border-left:2.5px solid var(--marca-ouro);padding:3mm 4mm;border-radius:0 1.5mm 1.5mm 0}
.doc .pessoa b{font-size:12.5px;font-weight:700;display:block;margin-bottom:1mm}
.doc .pessoa span{font-size:9.5px;color:#5a5348;display:block;line-height:1.6}

.doc table{width:100%;border-collapse:collapse;font-size:10.5px}
.doc table th{text-align:left;padding:2.5mm 2mm;border-bottom:1.5px solid var(--marca-preto);
  font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#3d382f}
.doc table td{padding:2.5mm 2mm;border-bottom:1px solid #eae5db}
.doc table tbody tr:last-child td{border-bottom:1px solid #d8d0c4}
.doc table .r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.doc table .c{text-align:center}
.doc table .prod b{font-weight:600}
.doc table .prod span{display:block;font-size:8.5px;color:#8a8175;font-family:var(--mono)}
.doc table tfoot td{border-bottom:none;font-weight:700;padding-top:3mm}
.doc table tr.sub td{font-weight:700;color:#16130f;background:#faf7f2}

.doc .tot{margin-top:4mm;margin-left:auto;width:72mm}
.doc .tot .l{display:flex;justify-content:space-between;gap:6mm;padding:1.2mm 0;font-size:10.5px;color:#4a453c}
.doc .tot .l span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.doc .tot .l.big{margin-top:2.5mm;padding:3mm 4mm;background:var(--marca-preto);color:#fff;
  border-radius:1.5mm;font-size:13px;font-weight:700;letter-spacing:.02em}
.doc .tot .l.big span:last-child{color:var(--marca-ouro-claro)}
.doc .tot .l.sub{border-top:1px solid #d8d0c4;margin-top:1.5mm;padding-top:2mm;font-weight:600;color:#16130f}

.doc .grid2{display:flex;gap:6mm}
.doc .grid2 > *{flex:1}
.doc .caixa{border:1px solid #e2dbcf;border-radius:2mm;padding:3mm 4mm}
.doc .caixa .k{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#8a8175;font-weight:700}
.doc .caixa .v{font-family:var(--mono);font-size:12px;font-weight:600;margin-top:1mm}

.doc .sig{margin-top:16mm;display:flex;gap:14mm;justify-content:space-around;text-align:center;font-size:9.5px}
.doc .sig div{flex:1;border-top:1px solid var(--marca-preto);padding-top:2mm;max-width:70mm;color:#4a453c}
.doc .sig div b{display:block;font-size:10.5px;color:#16130f;font-weight:600}

.doc .termo{margin-top:6mm;padding:3.5mm 4mm;border:1px solid var(--marca-ouro);border-radius:2mm;
  background:#fdfbf7;font-size:9px;line-height:1.65;color:#4a453c}
.doc .termo b{display:block;font-size:8px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--marca-ouro);margin-bottom:1.5mm}

.doc .ft{margin-top:9mm;padding-top:2.5mm;border-top:1px solid #e2dbcf;font-size:8px;color:#9a9185;
  display:flex;justify-content:space-between;align-items:center;gap:6mm}
.doc .ft .slogan{font-family:var(--serif);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--marca-ouro)}
.doc .aviso{margin-top:4mm;padding:2.5mm 3.5mm;background:#fdf4f4;border-left:2.5px solid #c0392b;
  font-size:9px;color:#8a2f24;border-radius:0 1.5mm 1.5mm 0}

</style>

<body>

/* ═══════════════════════════════════════════════════════════════════════

const SUPABASE_URL = 'https://amuogadwazxknsphpsga.supabase.co';
const SUPABASE_KEY = 'sb_publishable_E8AdwhPYUNpbd5zxQpFcLw_o7aX-xdt';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storage: window.localStorage }
});

const S = { user: null, perfil: null, params: {}, formas: [], categorias: [], marcas: [], dash: null };

/* ───────── utilidades ───────── */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const N = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const BRL = (v) => N(v).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const BRLn = (v) => N(v).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
const QTD = (v) => { const n = N(v); return (n % 1 === 0 ? n.toFixed(0) : n.toFixed(3).replace(/0+$/,'').replace(/\.$/,'')); };
const PCT = (v) => N(v).toLocaleString('pt-BR', { minimumFractionDigits:1, maximumFractionDigits:1 }) + '%';

const hoje = () => new Date().toLocaleDateString('sv-SE', { timeZone:'America/Sao_Paulo' });
const dBR  = (d) => d ? String(d).slice(0,10).split('-').reverse().join('/') : '—';
const dISO = (d) => d ? String(d).slice(0,10) : null;
const addDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv-SE'); };
const agoraBR = () => new Date().toLocaleString('pt-BR', { timeZone:'America/Sao_Paulo' });

const digits = (s) => String(s ?? '').replace(/\D/g,'');
const maskCPF = (s) => { const d = digits(s).slice(0,11); return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); };
const maskFone = (s) => { const d = digits(s).slice(0,11);
  return d.length <= 10 ? d.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{4})(\d)/,'$1-$2')
                        : d.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2'); };
const maskCEP = (s) => digits(s).slice(0,8).replace(/(\d{5})(\d)/,'$1-$2');

function validaCPF(cpf) {
  const c = digits(cpf);
  if (c.length !== 11 || /^(\d)\1{10}$/.test(c)) return false;
  let s = 0; for (let i = 0; i < 9; i++) s += +c[i] * (10 - i);
  let r = (s * 10) % 11; if (r === 10) r = 0; if (r !== +c[9]) return false;
  s = 0; for (let i = 0; i < 10; i++) s += +c[i] * (11 - i);
  r = (s * 10) % 11; if (r === 10) r = 0; return r === +c[10];
}

const UFS = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];

/* ───────── feedback ───────── */
function toast(titulo, msg, tipo = '') {
  const t = el(`<div class="toast ${tipo}"><b>${esc(titulo)}</b>${msg ? `<span>${esc(msg)}</span>` : ''}</div>`);
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s,transform .3s'; t.style.opacity = '0'; t.style.transform = 'translateX(24px)';
                     setTimeout(() => t.remove(), 300); }, tipo === 'bad' ? 7000 : 4200);
}
const ok   = (t, m) => toast(t, m, 'ok');
const bad  = (t, m) => toast(t, m, 'bad');
const warn = (t, m) => toast(t, m, 'warn');

/** Traduz o erro do Postgres para linguagem de negócio (RN-S05). */
function erroAmigavel(e) {
  const m = (e?.message || e?.error_description || String(e || '')).trim();
  if (/duplicate key|already exists/i.test(m)) {
    if (/cpf/i.test(m)) return 'Já existe um cadastro com este CPF.';
    if (/codigo/i.test(m)) return 'Já existe um registro com este código.';
    if (/nome/i.test(m)) return 'Já existe um registro com este nome.';
    return 'Este registro já existe.';
  }
  if (/violates foreign key/i.test(m)) return 'Este registro está sendo usado em outro lugar e não pode ser removido.';
  if (/violates row-level security/i.test(m)) return 'Você não tem permissão para esta operação.';
  if (/JWT|not authenticated|Invalid login/i.test(m)) return 'Sessão expirada. Entre novamente.';
  if (/chk_vendas_desconto/i.test(m)) return 'O desconto não pode ser maior que o valor dos produtos.';
  if (/chk_.*_negativa|check_violation/i.test(m) && /Saldo insuficiente/i.test(m)) return m;
  if (/^ERROR:\s*/i.test(m)) return m.replace(/^ERROR:\s*/i,'');
  return m || 'Não foi possível concluir a operação.';
}

/* ───────── modal ───────── */
function modal({ titulo, corpo, rodape, largura = '', aoAbrir }) {
  const ov = el(`<div class="ov"><div class="modal ${largura}">
    <div class="modal-h"><h3>${esc(titulo)}</h3><button class="x" type="button">×</button></div>
    <div class="modal-b"></div>
    ${rodape !== null ? '<div class="modal-f"></div>' : ''}
  </div></div>`);
  const body = $('.modal-b', ov);
  body.innerHTML = typeof corpo === 'string' ? corpo : '';
  if (corpo instanceof Node) body.appendChild(corpo);
  const foot = $('.modal-f', ov);
  if (foot && rodape) foot.innerHTML = rodape;
  const fechar = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') fechar(); };
  $('.x', ov).onclick = fechar;
  ov.onclick = (e) => { if (e.target === ov) fechar(); };
  document.addEventListener('keydown', onKey);
  $('#modals').appendChild(ov);
  const ctx = { ov, body, foot, fechar };
  if (aoAbrir) aoAbrir(ctx);
  setTimeout(() => { const f = $('input:not([type=hidden]),select,textarea', body); if (f) f.focus(); }, 60);
  return ctx;
}

/** Confirmação obrigatória antes de excluir ou cancelar (RN-S02). */
function confirmar({ titulo, mensagem, detalhes = '', textoBotao = 'Confirmar', perigo = true, pedirMotivo = false }) {
  return new Promise(resolve => {
    const m = modal({
      titulo, largura: 'narrow',
      corpo: `<p style="font-size:14px;margin-bottom:${detalhes || pedirMotivo ? '14px' : '0'}">${mensagem}</p>
        ${detalhes ? `<div class="alert warn">${detalhes}</div>` : ''}
        ${pedirMotivo ? `<div class="field" style="margin-top:6px"><label>Motivo <span style="color:var(--red)">*</span></label>
           <textarea class="inp" id="cmotivo" placeholder="Explique o motivo — ficará registrado na auditoria"></textarea></div>` : ''}`,
      rodape: `<button class="btn btn-s" data-x>Voltar</button>
               <button class="btn ${perigo ? 'btn-d' : 'btn-p'}" data-ok>${esc(textoBotao)}</button>`
    });
    $('[data-x]', m.foot).onclick = () => { m.fechar(); resolve(null); };
    $('[data-ok]', m.foot).onclick = () => {
      if (pedirMotivo) {
        const mo = $('#cmotivo', m.body).value.trim();
        if (mo.length < 3) { bad('Motivo obrigatório', 'Descreva o motivo com pelo menos 3 caracteres.'); return; }
        m.fechar(); resolve(mo);
      } else { m.fechar(); resolve(true); }
    };
  });
}

/** Sessão expirada no meio do uso: em vez de espalhar erro pelas telas,
 *  avisa uma única vez e devolve o usuário para o login. */
let sessaoCaindo = false;
function checarSessao(error) {
  const m = String(error?.message || '');
  const cod = String(error?.code || '');
  if (!/JWT|jwt expired|not authenticated|invalid claim|token is expired/i.test(m)
      && cod !== 'PGRST301' && error?.status !== 401) return;
  if (sessaoCaindo) return;
  sessaoCaindo = true;
  bad('Sessão expirada', 'Entre novamente para continuar.');
  setTimeout(async () => { try { await sb.auth.signOut(); } catch (e) {} location.reload(); }, 1800);
}

async function q(fn) {
  const { data, error } = await fn;
  if (error) { checarSessao(error); throw error; }
  return data;
}
async function rpc(nome, args) {
  const { data, error } = await sb.rpc(nome, args);
  if (error) { checarSessao(error); throw error; }
  return data;
}

/** Campo de busca com sugestões, usado para produto/cliente/revendedor/fornecedor.
 *  A lista é presa ao <body> com position:fixed — dentro das tabelas de itens
 *  (que têm overflow-x:auto) uma lista absoluta ficava recortada e invisível.
 *  opcoes.aoCriar: função (termo) chamada pelo item "Cadastrar novo…". */
function autocomplete(input, buscar, aoEscolher, formatar, opcoes = {}) {
  if (input.__ac) input.__ac.destruir();

  const box = el('<div class="gres flut"></div>');
  document.body.appendChild(box);

  let t, itens = [], idx = -1, aberto = false;

  const posicionar = () => {
    const r = input.getBoundingClientRect();
    box.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 270)) + 'px';
    box.style.width = Math.max(r.width, 250) + 'px';
    const espacoAbaixo = window.innerHeight - r.bottom;
    if (espacoAbaixo < 190 && r.top > 220) {
      box.style.top = ''; box.style.bottom = (window.innerHeight - r.top + 4) + 'px';
    } else {
      box.style.bottom = ''; box.style.top = (r.bottom + 4) + 'px';
    }
  };
  const fechar = () => { box.classList.remove('on'); idx = -1; aberto = false; };
  const abrir = () => { posicionar(); box.classList.add('on'); aberto = true; };
  const pintar = () => $$('a[data-i]', box).forEach((a, i) => a.style.background = i === idx ? 'var(--brand-50)' : '');

  const destruir = () => {
    clearTimeout(t); box.remove();
    window.removeEventListener('scroll', aoRolar, true);
    window.removeEventListener('resize', aoRolar);
    document.removeEventListener('click', aoClicarFora, true);
    delete input.__ac;
  };
  const aoRolar = () => { if (!aberto) return;
    if (!document.contains(input)) return destruir();
    posicionar(); };
  const aoClicarFora = (e) => { if (!box.contains(e.target) && e.target !== input) fechar(); };
  window.addEventListener('scroll', aoRolar, true);
  window.addEventListener('resize', aoRolar);
  document.addEventListener('click', aoClicarFora, true);
  input.__ac = { destruir, fechar };

  const linhaCriar = (termo) => opcoes.aoCriar
    ? `<a href="#" class="criar" data-criar>➕ Cadastrar "${esc(termo)}" agora</a>` : '';

  const ligar = (termo) => {
    $$('a[data-i]', box).forEach((a, i) => a.onclick = (e) => {
      e.preventDefault(); e.stopPropagation(); aoEscolher(itens[i]); fechar(); });
    const c = $('[data-criar]', box);
    if (c) c.onclick = (e) => { e.preventDefault(); e.stopPropagation(); fechar(); opcoes.aoCriar(termo); };
  };

  const procurar = async () => {
    const termo = input.value.trim();
    if (termo.length < 1) return fechar();
    try {
      itens = await buscar(termo) || [];
      box.innerHTML = itens.length
        ? itens.map((x, i) => formatar(x).replace('<a ', `<a data-i="${i}" `)).join('') + linhaCriar(termo)
        : `<a class="vazio">Nenhum resultado para "${esc(termo)}"</a>` + linhaCriar(termo);
      abrir(); idx = -1; ligar(termo);
    } catch (e) {
      box.innerHTML = `<a class="vazio">Erro na busca: ${esc(erroAmigavel(e))}</a>` + linhaCriar(termo);
      abrir(); ligar(termo);
    }
  };

  input.addEventListener('input', () => { clearTimeout(t); t = setTimeout(procurar, 220); });
  input.addEventListener('focus', () => { if (input.value.trim().length >= 1 && !aberto) procurar(); });
  input.addEventListener('keydown', (e) => {
    if (!aberto) { if (e.key === 'ArrowDown' && input.value.trim()) procurar(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(idx + 1, itens.length - 1); pintar(); }
    if (e.key === 'ArrowUp')   { e.preventDefault(); idx = Math.max(idx - 1, 0); pintar(); }
    if (e.key === 'Enter') { e.preventDefault();
      if (idx >= 0 && itens[idx]) { aoEscolher(itens[idx]); fechar(); }
      else if (itens.length === 1) { aoEscolher(itens[0]); fechar(); } }
    if (e.key === 'Escape') fechar();
  });
  return { fechar, destruir };
}

function exportarExcel(nomeArquivo, colunas, linhas, resumo) {
  try {
    const wb = XLSX.utils.book_new();
    const dados = linhas.map(l => { const o = {}; colunas.forEach(c => o[c.t] = c.v(l)); return o; });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dados), 'Dados');
    if (resumo) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resumo), 'Resumo');
    XLSX.writeFile(wb, `${nomeArquivo}-${hoje()}.xlsx`);
    ok('Excel gerado', `${linhas.length} registro(s) exportado(s).`);
  } catch (e) {
    const csv = '﻿' + [colunas.map(c => c.t).join(';')]
      .concat(linhas.map(l => colunas.map(c => String(c.v(l) ?? '').replace(/;/g, ',')).join(';'))).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
    a.download = `${nomeArquivo}-${hoje()}.csv`; a.click();
    ok('CSV gerado', 'O arquivo abre direto no Excel.');
  }
}

/* ═══════════════ GRÁFICOS (SVG puro, sem dependência) ═══════════════ */
function grafLinha(series, labels, cores, alt = 220) {
  const W = 700, H = alt, P = { t:14, r:14, b:26, l:60 };
  const todos = series.flat().map(N);
  const max = Math.max(...todos, 1) * 1.12, min = Math.min(...todos, 0);
  const n = labels.length;
  const x = i => P.l + (n <= 1 ? 0 : i * (W - P.l - P.r) / (n - 1));
  const y = v => H - P.b - ((N(v) - min) / (max - min || 1)) * (H - P.t - P.b);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const yy = P.t + i * (H - P.t - P.b) / 4, val = max - i * (max - min) / 4;
    g += `<line x1="${P.l}" y1="${yy}" x2="${W - P.r}" y2="${yy}" stroke="#eef2f7"/>
          <text x="${P.l - 7}" y="${yy + 4}" text-anchor="end" font-size="10" fill="#94a3b8" font-family="IBM Plex Mono">${
            Math.abs(val) >= 1000 ? (val/1000).toFixed(1).replace('.',',') + 'k' : val.toFixed(0)}</text>`;
  }
  labels.forEach((l, i) => { if (n <= 8 || i % Math.ceil(n / 7) === 0)
    g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#94a3b8">${esc(l)}</text>`; });
  series.forEach((s, si) => {
    const pts = s.map((v, i) => `${x(i)},${y(v)}`).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="${cores[si]}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (si === 0) g += `<polygon points="${P.l},${H - P.b} ${pts} ${x(n - 1)},${H - P.b}" fill="${cores[si]}" opacity=".07"/>`;
    s.forEach((v, i) => { if (n <= 14) g += `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#fff" stroke="${cores[si]}" stroke-width="2"/>`; });
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

function grafRosca(dados, alt = 220) {
  const tot = dados.reduce((a, d) => a + N(d.v), 0);
  if (tot <= 0) return `<div class="empty" style="padding:36px"><p>Sem dados no período.</p></div>`;
  const R = 78, r = 50, cx = 110, cy = 110;
  let ang = -Math.PI / 2, g = '';
  dados.forEach(d => {
    const frac = N(d.v) / tot; if (frac <= 0) return;
    const a2 = ang + frac * Math.PI * 2, grande = frac > .5 ? 1 : 0;
    const p = (a, rr) => `${cx + rr * Math.cos(a)},${cy + rr * Math.sin(a)}`;
    g += `<path d="M ${p(ang,R)} A ${R} ${R} 0 ${grande} 1 ${p(a2,R)} L ${p(a2,r)} A ${r} ${r} 0 ${grande} 0 ${p(ang,r)} Z"
           fill="${d.c}" stroke="#fff" stroke-width="1.5"/>`;
    ang = a2;
  });
  g += `<text x="${cx}" y="${cy - 3}" text-anchor="middle" font-size="10" fill="#94a3b8">TOTAL</text>
        <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a"
          font-family="IBM Plex Mono">${BRLn(tot)}</text>`;
  return `<svg class="chart" style="height:${alt}px" viewBox="0 0 220 220" preserveAspectRatio="xMidYMid meet">${g}</svg>
    <div class="lgd">${dados.filter(d => N(d.v) > 0).map(d =>
      `<span><i style="background:${d.c}"></i>${esc(d.t)} · ${BRL(d.v)}</span>`).join('')}</div>`;
}

ROTAS.produtos = async (v, id) => {
  if (id) return fichaProduto(v, id);
  crumb('Produtos');
  const prods = await q(sb.from('vw_produtos').select('*').order('nome'));
  const totEst = prods.reduce((a, p) => a + N(p.valor_estoque_disponivel), 0);
  const margens = prods.filter(p => N(p.preco_consumidor) > 0).map(p => N(p.margem_consumidor));
  const margemMedia = margens.length ? margens.reduce((a, b) => a + b, 0) / margens.length : 0;

  v.innerHTML = `
  <div class="page-head"><h1>Produtos<small>${prods.length} cadastrado(s)</small></h1>
    <div class="acts">
      <button class="btn btn-s btn-sm" id="expBtn">📊 Excel</button>
      <button class="btn btn-p" id="novoBtn">+ Novo produto</button></div></div>
  <div class="kpis k5">
    <div class="kpi"><div class="lab">Produtos</div><div class="val">${prods.length}</div></div>
    <div class="kpi blue"><div class="lab">Valor do estoque</div><div class="val">${BRL(totEst)}</div></div>
    <div class="kpi"><div class="lab">Esgotados</div><div class="val">${prods.filter(p => N(p.qtd_total) === 0).length}</div></div>
    <div class="kpi amber"><div class="lab">Estoque baixo</div><div class="val">${prods.filter(p => p.estoque_baixo && N(p.qtd_total) > 0).length}</div></div>
    <div class="kpi green"><div class="lab">Margem média</div><div class="val">${PCT(margemMedia)}</div></div>
  </div>
  <div class="card"><div class="filters">
      <input class="inp grow" id="fq" placeholder="🔍 Buscar por nome ou código…">
      <select class="inp" id="fcat"><option value="">Todas as categorias</option>${selectOpts(S.categorias)}</select>
      <select class="inp" id="fsit"><option value="">Todas as situações</option>
        <option value="DISPONIVEL">Disponível</option><option value="ESGOTADO">Esgotado</option>
        <option value="EM_MOSTRUARIO">Em mostruário</option><option value="COM_REVENDEDOR">Com revendedor</option></select>
      <label class="chk"><input type="checkbox" id="fbaixo"> Só estoque baixo</label>
    </div>
    <div class="tw"><table class="dt"><thead><tr>
      <th>Produto</th><th>Categoria</th><th class="r">Custo médio</th><th class="r">Consumidor</th>
      <th class="r">Revendedor</th><th class="r">Margem</th><th class="c">Disp.</th><th class="c">Most.</th>
      <th class="c">Consig.</th><th class="c">Situação</th><th></th></tr></thead>
      <tbody id="tb"></tbody></table></div>
    <div class="pager"><span id="cnt"></span></div></div>`;

  const pintar = () => {
    const t = $('#fq').value.trim().toLowerCase(), cat = $('#fcat').value, sit = $('#fsit').value, baixo = $('#fbaixo').checked;
    const f = prods.filter(p =>
      (!t || (p.nome + ' ' + p.codigo).toLowerCase().includes(t)) &&
      (!cat || p.categoria_id === cat) && (!sit || p.situacao === sit) &&
      (!baixo || (p.estoque_baixo && N(p.qtd_total) > 0)));
    $('#cnt').textContent = `${f.length} de ${prods.length} produto(s)`;
    $('#tb').innerHTML = f.length ? f.map(p => `<tr>
      <td><a href="#produtos/${p.id}" class="pnome"><div class="ph">🌸</div><div style="min-width:0">
        <b>${esc(p.nome)}</b><span>${esc(p.codigo)}${p.tamanho ? ' · ' + esc(p.tamanho) : ''}</span></div></a></td>
      <td>${esc(p.categoria_nome || '—')}</td>
      <td class="r money">${BRL(p.custo_medio)}</td>
      <td class="r money ${p.preco_abaixo_custo ? 'neg' : ''}">${BRL(p.preco_consumidor)}${p.preco_abaixo_custo ? ' ⚠' : ''}</td>
      <td class="r money">${BRL(p.preco_revendedor)}</td>
      <td class="r"><span class="tag ${N(p.margem_consumidor) >= 40 ? 'g' : N(p.margem_consumidor) >= 20 ? 'a' : 'r'}">${PCT(p.margem_consumidor)}</span></td>
      <td class="c ${p.estoque_baixo ? 'neg' : ''}"><b>${QTD(p.qtd_disponivel)}</b></td>
      <td class="c">${N(p.qtd_mostruario) ? QTD(p.qtd_mostruario) : '—'}</td>
      <td class="c">${N(p.qtd_consignado) ? QTD(p.qtd_consignado) : '—'}</td>
      <td class="c"><span class="tag ${{DISPONIVEL:'g',ESGOTADO:'n',EM_MOSTRUARIO:'a',COM_REVENDEDOR:'v',RESERVADO:'b'}[p.situacao]}">
        ${{DISPONIVEL:'Disponível',ESGOTADO:'Esgotado',EM_MOSTRUARIO:'Mostruário',COM_REVENDEDOR:'Revendedor',RESERVADO:'Reservado'}[p.situacao]}</span></td>
      <td class="nw"><button class="btn btn-ghost btn-sm" data-ed="${p.id}">✎</button></td></tr>`).join('')
      : `<tr><td colspan="11">${vazio('🌸','Nenhum produto encontrado','Ajuste os filtros ou cadastre um novo produto.')}</td></tr>`;
    $$('[data-ed]').forEach(b => b.onclick = () => formProduto(prods.find(x => x.id === b.dataset.ed)));
  };
  ['#fq','#fcat','#fsit','#fbaixo'].forEach(s => $(s).addEventListener('input', pintar));
  $('#novoBtn').onclick = () => formProduto(null);
  $('#expBtn').onclick = () => exportarExcel('produtos', [
    { t:'Código', v:p => p.codigo }, { t:'Nome', v:p => p.nome }, { t:'Categoria', v:p => p.categoria_nome || '' },
    { t:'Marca', v:p => p.marca_nome || '' }, { t:'Tamanho', v:p => p.tamanho || '' },
    { t:'Custo médio', v:p => N(p.custo_medio) }, { t:'Preço consumidor', v:p => N(p.preco_consumidor) },
    { t:'Preço revendedor', v:p => N(p.preco_revendedor) }, { t:'Margem consumidor %', v:p => N(p.margem_consumidor) },
    { t:'Disponível', v:p => N(p.qtd_disponivel) }, { t:'Mostruário', v:p => N(p.qtd_mostruario) },
    { t:'Consignado', v:p => N(p.qtd_consignado) }, { t:'Valor em estoque', v:p => N(p.valor_estoque_disponivel) },
    { t:'Situação', v:p => p.situacao }], prods);
  pintar();
};

    const f = (preco, alvo) => {
      const h = $(alvo, m.body);
      if (!preco) { h.textContent = ''; h.className = 'hint'; return; }
      if (!custo) { h.textContent = 'Sem custo ainda — a margem aparece após a primeira compra.'; h.className = 'hint'; return; }
      const mg = (preco - custo) / preco * 100, mk = (preco - custo) / custo * 100;
      h.textContent = `Lucro ${BRL(preco - custo)} · margem ${PCT(mg)} · markup ${PCT(mk)}`;
      h.className = 'hint' + (preco < custo ? ' bad' : mg < 20 ? ' warn' : '');
      if (preco < custo) h.textContent = `⚠ Abaixo do custo — prejuízo de ${BRL(custo - preco)} por unidade`;
    };
    f(pc, '#h_pc'); f(pr, '#h_pr');
  };
  $('#p_pc', m.body).addEventListener('input', atualizarMargens);
  $('#p_pr', m.body).addEventListener('input', atualizarMargens);
  atualizarMargens();

  $('[data-x]', m.foot).onclick = m.fechar;
  if (!novo) $('[data-del]', m.foot).onclick = async () => {
    const c = await confirmar({ titulo:'Excluir produto',
      mensagem:`Excluir <b>${esc(p.nome)}</b>?`,
      detalhes:'O produto sai das listas, mas todo o histórico de compras e vendas é preservado.',
      textoBotao:'Excluir' });
    if (!c) return;
    try { await q(sb.from('produtos').update({ deleted_at:new Date().toISOString() }).eq('id', p.id));
          m.fechar(); ok('Produto excluído'); navegar(); }
    catch (e) { bad('Não foi possível excluir', erroAmigavel(e)); }
  };

  $('[data-save]', m.foot).onclick = async (ev) => {
    const b = ev.target;
    const nome = $('#p_nome', m.body).value.trim();
    if (nome.length < 2) return bad('Nome obrigatório', 'Informe o nome do produto.');
    const pc = N($('#p_pc', m.body).value), pr = N($('#p_pr', m.body).value);
    if (pr > pc && pc > 0) {
      const c = await confirmar({ titulo:'Preço de revendedor maior', perigo:false, textoBotao:'Salvar assim mesmo',
        mensagem:'O preço para revendedor está <b>maior</b> que o preço para consumidor final.',
        detalhes:'Normalmente o revendedor compra mais barato. Confira se não houve troca dos campos.' });
      if (!c) return;
    }
    const dados = {
      nome, codigo: $('#p_codigo', m.body).value.trim() || undefined,
      descricao: $('#p_desc', m.body).value.trim() || null,
      categoria_id: $('#p_cat', m.body).value || null, marca_id: $('#p_marca', m.body).value || null,
      tamanho: $('#p_tam', m.body).value.trim() || null, cor: $('#p_cor', m.body).value.trim() || null,
      codigo_barras: $('#p_ean', m.body).value.trim() || null, foto_url: $('#p_foto', m.body).value.trim() || null,
      preco_consumidor: pc, preco_revendedor: pr,
      estoque_minimo: N($('#p_min', m.body).value), ativo: $('#p_ativo', m.body).checked
    };
    if (!dados.codigo) delete dados.codigo;
    b.disabled = true; b.innerHTML = '<span class="spin"></span> Salvando…';
    try {
      const r = novo ? await q(sb.from('produtos').insert(dados).select().single())
                     : await q(sb.from('produtos').update(dados).eq('id', p.id).select().single());
      m.fechar(); ok(novo ? 'Produto cadastrado' : 'Produto atualizado', nome);
      if (aoSalvar) {
        // Volta com os campos que o seletor de produtos usa
        const completo = await q(sb.from('vw_produtos').select('*').eq('id', r.id).single());
        aoSalvar(completo);
      } else navegar();
    } catch (e) { bad('Não foi possível salvar', erroAmigavel(e)); b.disabled = false; b.textContent = 'Salvar'; }
  };
}

ROTAS.compras = async (v, id) => {

  const sum = (f) => conf.reduce((a, c) => a + N(c[f]), 0);

  v.innerHTML = `
  <div class="page-head"><h1>Compras<small>${cs.length} registro(s)</small></h1>

  </div>
  <div class="card"><div class="filters">
      <input class="inp grow" id="fq" placeholder="🔍 Buscar por fornecedor ou nº…">
      <select class="inp" id="fst"><option value="">Todas as situações</option>
        <option value="RASCUNHO">Rascunho</option><option value="CONFIRMADO">Confirmada</option>
        <option value="CANCELADO">Cancelada</option></select>
      <input class="inp" type="date" id="fd1"><input class="inp" type="date" id="fd2"></div>
    <div class="tw"><table class="dt"><thead><tr>
      <th>Nº</th><th>Data</th><th>Fornecedor</th><th class="c">Itens</th><th class="r">Produtos</th>
      <th class="r">Frete</th><th class="r">Taxa</th><th class="r">Custo total</th><th class="c">Situação</th></tr></thead>
      <tbody id="tb"></tbody></table></div><div class="pager"><span id="cnt"></span></div></div>`;

  const pintar = () => {
    const t = $('#fq').value.trim().toLowerCase(), st = $('#fst').value, d1 = $('#fd1').value, d2 = $('#fd2').value;
    const f = cs.filter(c =>
      (!t || ((c.fornecedores?.nome || '') + ' ' + c.numero).toLowerCase().includes(t)) &&
      (!st || c.status === st) && (!d1 || c.data_compra >= d1) && (!d2 || c.data_compra <= d2));
    $('#cnt').textContent = `${f.length} de ${cs.length} compra(s)`;
    $('#tb').innerHTML = f.length ? f.map(c => `<tr style="cursor:pointer" data-go="${c.id}">
      <td class="num"><b>${c.numero}</b></td><td class="nw">${dBR(c.data_compra)}</td>

      : `<tr><td colspan="9">${vazio('📥','Nenhuma compra','Registre a primeira compra para o estoque começar a existir.',
          '<a class="btn btn-p" href="#compras/nova">+ Nova compra</a>')}</td></tr>`;
    $$('[data-go]').forEach(r => r.onclick = () => location.hash = `#compras/${r.dataset.go}`);
  };
  ['#fq','#fst','#fd1','#fd2'].forEach(s => $(s).addEventListener('input', pintar));
  $('#expBtn').onclick = () => exportarExcel('compras', [
    { t:'Nº', v:c => c.numero }, { t:'Data', v:c => dBR(c.data_compra) },
    { t:'Fornecedor', v:c => c.fornecedores?.nome || '' }, { t:'Documento', v:c => c.numero_documento || '' },
    { t:'Produtos', v:c => N(c.subtotal_produtos) }, { t:'Frete', v:c => N(c.valor_frete) },
    { t:'Taxa cartão', v:c => N(c.valor_taxa_cartao) }, { t:'Outros', v:c => N(c.outros_custos) },
    { t:'Custo total', v:c => N(c.custo_total) }, { t:'Situação', v:c => c.status }], cs);
  pintar();
};

    $('#c_forn').style.borderColor = ''; recalc(); };
  autocomplete($('#c_forn'), buscaFornecedor, escolherForn, fmtPessoa,
    { aoCriar: (termo) => formPessoa('fornecedores', null, escolherForn, { nome: termo }) });
  $('#novoForn').onclick = (e) => { e.preventDefault(); formPessoa('fornecedores', null, escolherForn); };

  const linha = (i) => {
    const it = itens[i];
    const pend = !it.produto_id;
    return `<tr data-i="${i}" style="${pend ? 'background:#fffdf5' : ''}">
      <td><div style="position:relative"><input class="inp p-busca" placeholder="Digite o nome ou o código…"
        value="${esc(it.nome || '')}" autocomplete="off" style="${pend ? 'border-color:var(--amber)' : ''}"></div>
        ${pend ? '<span style="font-size:11px;color:var(--amber);font-weight:600">⚠ escolha o produto na lista que aparece</span>' : ''}</td>
      <td><input class="inp num q" type="number" step="0.001" min="0.001" value="${it.qtd || ''}"></td>
      <td><input class="inp num vu" type="number" step="0.0001" min="0" value="${it.vu || ''}"></td>
      <td class="r money sub">${BRL(N(it.qtd) * N(it.vu))}</td>
      <td><button class="btn btn-ghost btn-sm rm" title="Remover">✕</button></td></tr>`;
  };

  const recalc = () => {
    const sub = itens.reduce((a, i) => a + Math.round(N(i.qtd) * N(i.vu) * 100) / 100, 0);
    const fre = N($('#c_frete').value), tax = N($('#c_taxa').value), out = N($('#c_outros').value);
    const ac = fre + tax + out, tot = sub + ac;
    $('#s_sub').textContent = BRL(sub); $('#s_fre').textContent = BRL(fre);
    $('#s_tax').textContent = BRL(tax); $('#s_out').textContent = BRL(out); $('#s_tot').textContent = BRL(tot);
    $('#semItens').style.display = itens.length ? 'none' : '';

    // O que ainda falta — visível, em vez de um botão desabilitado sem explicação
    const falta = [];
    if (!$('#c_forn_id').value) falta.push($('#c_forn').value.trim()
      ? 'Escolher o fornecedor na lista de sugestões (digitar o nome não basta)'
      : 'Informar o fornecedor');
    if (!itens.length) falta.push('Adicionar ao menos um produto');
    if (itens.some(i => !i.produto_id)) falta.push('Escolher o produto na lista de sugestões em todas as linhas');
    if (itens.some(i => i.produto_id && N(i.qtd) <= 0)) falta.push('Informar a quantidade de todos os produtos');
    $('#pend').innerHTML = falta.length
      ? `<div class="alert warn" style="margin:0;font-size:12.5px"><span>⚠</span><div><b>Falta:</b><br>${
          falta.map(f => '· ' + esc(f)).join('<br>')}</div></div>`
      : '<div class="alert ok" style="margin:0;font-size:12.5px"><span>✓</span><div>Tudo pronto para confirmar.</div></div>';

    // Prévia do rateio — o mesmo cálculo que a função do banco fará (RN-C02/C03)
    const crit = $('#c_crit').value;
    const base = crit === 'VALOR' ? sub : itens.reduce((a, i) => a + N(i.qtd), 0);
    if (!itens.length || !base) { $('#previa').innerHTML = ''; return; }
    let soma = 0;
    const calc = itens.map(i => {
      const s = Math.round(N(i.qtd) * N(i.vu) * 100) / 100;
      const r = Math.round(ac * (crit === 'VALOR' ? s : N(i.qtd)) / base * 100) / 100;
      soma += r; return { ...i, s, r };
    });
    if (ac > 0 && calc.length) {
      const res = Math.round((ac - soma) * 100) / 100;
      let iMaior = 0, maior = -1;
      calc.forEach((c, idx) => { const p = crit === 'VALOR' ? c.s : N(c.qtd); if (p > maior) { maior = p; iMaior = idx; } });
      calc[iMaior].r = Math.round((calc[iMaior].r + res) * 100) / 100;
    }
    $('#previa').innerHTML = `<div class="sec-t" style="margin:0 0 9px">Custo unitário após o rateio</div>
      ${calc.map(c => { const cu = (c.s + c.r) / (N(c.qtd) || 1); const up = N(c.vu) ? (cu / N(c.vu) - 1) * 100 : 0;
        return `<div style="display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px solid #f1f5f9">
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.nome || '—')}</span>
        <b class="money">${BRL(cu)}${up ? ` <span style="color:var(--amber);font-weight:500">+${up.toFixed(1)}%</span>` : ''}</b></div>`; }).join('')}
      <div style="font-size:11.5px;color:var(--mute);margin-top:8px">Rateio total: ${BRL(calc.reduce((a, c) => a + c.r, 0))} — confere com os custos acessórios ✓</div>`;
  };

  const render = () => {
    const tb = $('#itb tbody');
    tb.innerHTML = itens.map((_, i) => linha(i)).join('');
    $$('#itb tbody tr').forEach(tr => {
      const i = +tr.dataset.i;
      const inp = $('.p-busca', tr);
      const escolher = (p) => {
        if (itens.some((x, j) => j !== i && x.produto_id === p.id)) {
          bad('Produto repetido', `${p.nome} já está na lista. Ajuste a quantidade da linha existente.`); return; }
        itens[i] = { ...itens[i], produto_id:p.id, nome:p.nome, vu: itens[i].vu || N(p.ultimo_custo) || '' };
        render(); recalc();
      };
      autocomplete(inp, buscaProduto, escolher, fmtProd,
        { aoCriar: (termo) => formProduto(null, escolher, { nome: termo }) });
      $('.q', tr).oninput = (e) => { itens[i].qtd = e.target.value; $('.sub', tr).textContent = BRL(N(itens[i].qtd) * N(itens[i].vu)); recalc(); };
      $('.vu', tr).oninput = (e) => { itens[i].vu = e.target.value; $('.sub', tr).textContent = BRL(N(itens[i].qtd) * N(itens[i].vu)); recalc(); };
      $('.rm', tr).onclick = () => { itens.splice(i, 1); render(); recalc(); };
    });
    recalc();
  };

  $('#addItem').onclick = () => { itens.push({ qtd:'', vu:'' }); render();
    setTimeout(() => { const l = $$('#itb tbody .p-busca').pop(); if (l) l.focus(); }, 40); };
  ['#c_frete','#c_taxa','#c_outros','#c_crit'].forEach(s => $(s).addEventListener('input', recalc));
  $('#c_forn').addEventListener('input', () => { if (!$('#c_forn').value.trim()) $('#c_forn_id').value = ''; recalc(); });

  $('#calcTaxa').onclick = () => {
    const sub = itens.reduce((a, i) => a + N(i.qtd) * N(i.vu), 0);
    if (!sub) return warn('Adicione os produtos primeiro', 'A taxa é calculada sobre o valor dos produtos.');
    const m = modal({ titulo:'Calcular taxa do cartão', largura:'narrow',
      corpo:`<p style="margin-bottom:14px;font-size:13.5px">Valor dos produtos: <b>${BRL(sub)}</b></p>
        <div class="field"><label>Percentual da maquininha</label>
        <input class="inp num" type="number" step="0.01" id="tx_p" value="3.49" autofocus></div>
        <div class="sumbox" style="margin-top:12px"><div class="sumrow tot" style="margin:0;border:none;padding:0">
        <span class="l">Taxa em reais</span><span class="money" id="tx_r">${BRL(sub * 0.0349)}</span></div></div>`,
      rodape:`<button class="btn btn-s" data-x>Cancelar</button><button class="btn btn-p" data-ok>Usar este valor</button>` });
    const upd = () => $('#tx_r', m.body).textContent = BRL(sub * N($('#tx_p', m.body).value) / 100);
    $('#tx_p', m.body).oninput = upd;
    $('[data-x]', m.foot).onclick = m.fechar;
    $('[data-ok]', m.foot).onclick = () => {
      $('#c_taxa').value = (sub * N($('#tx_p', m.body).value) / 100).toFixed(2); m.fechar(); recalc(); };
  };

  $('#confirmar').onclick = async (ev) => {
    const b = ev.target;
    if (!$('#c_forn_id').value) return bad('Fornecedor não selecionado',
      $('#c_forn').value.trim()
        ? 'Digite o nome e clique no fornecedor na lista que aparece abaixo do campo. Se ele ainda não existe, use "Cadastrar fornecedor".'
        : 'Informe o fornecedor da compra.');
    if (!itens.length) return bad('Sem produtos', 'Clique em "Adicionar produto".');
    for (const i of itens) {
      if (!i.produto_id) return bad('Produto não selecionado',
        'Em cada linha, digite o nome e clique no produto na lista que aparece. Se ele ainda não existe, use "Cadastrar … agora" no fim da lista.');
      if (N(i.qtd) <= 0) return bad('Quantidade inválida', `Informe a quantidade de ${i.nome}.`);
    }
    b.disabled = true; b.innerHTML = '<span class="spin"></span> Confirmando…';
    let compraId = null;
    try {
      const c = await q(sb.from('compras').insert({
        fornecedor_id: $('#c_forn_id').value, data_compra: $('#c_data').value,
        numero_documento: $('#c_doc').value.trim() || null, criterio_rateio: $('#c_crit').value,
        valor_frete: N($('#c_frete').value), valor_taxa_cartao: N($('#c_taxa').value),
        outros_custos: N($('#c_outros').value), observacoes: $('#c_obs').value.trim() || null
      }).select().single());
      compraId = c.id;
      await q(sb.from('compra_itens').insert(itens.map(i => ({
        compra_id: c.id, produto_id: i.produto_id, quantidade: N(i.qtd), valor_unitario: N(i.vu),
        subtotal: Math.round(N(i.qtd) * N(i.vu) * 100) / 100 }))));
      await rpc('fn_confirmar_compra', { p_compra_id: c.id });
      ok('Compra confirmada', 'Estoque e custo médio atualizados.');
      location.hash = `#compras/${c.id}`;
    } catch (e) {
      if (compraId) { try { await sb.from('compras').delete().eq('id', compraId); } catch (_) {} }
      bad('Não foi possível confirmar', erroAmigavel(e));
      b.disabled = false; b.textContent = 'Confirmar compra';
    }
  };
  render();
}

async function fichaCompra(v, id) {
  const c = await q(sb.from('compras').select('*,fornecedores(*),compra_itens(*,produtos(codigo,nome,tamanho))').eq('id', id).single());
  crumb(`Compras › nº ${c.numero}`);
  const badge = { RASCUNHO:['a','Rascunho'], CONFIRMADO:['g','Confirmada'], CANCELADO:['r','Cancelada'] }[c.status];
  v.innerHTML = `
  <div class="page-head"><h1>Compra nº ${c.numero} <span class="tag ${badge[0]}">${badge[1]}</span>
    <small>${dBR(c.data_compra)} · ${esc(c.fornecedores?.nome || '—')}${c.numero_documento ? ' · doc ' + esc(c.numero_documento) : ''}</small></h1>
    <div class="acts"><a class="btn btn-s btn-sm" href="#compras">← Voltar</a>
      ${c.status === 'CONFIRMADO' ? '<button class="btn btn-d btn-sm" id="canBtn">Cancelar compra</button>' : ''}</div></div>
  ${c.status === 'CANCELADO' ? `<div class="alert bad"><span>⛔</span><div><b>Compra cancelada</b> em ${dBR(c.data_cancelamento)}.<br>Motivo: ${esc(c.motivo_cancelamento || '')}</div></div>` : ''}
  <div class="kpis k5">
    <div class="kpi"><div class="lab">Produtos</div><div class="val">${BRL(c.subtotal_produtos)}</div></div>
    <div class="kpi"><div class="lab">Frete</div><div class="val">${BRL(c.valor_frete)}</div></div>
    <div class="kpi"><div class="lab">Taxa de cartão</div><div class="val">${BRL(c.valor_taxa_cartao)}</div></div>
    <div class="kpi"><div class="lab">Outros</div><div class="val">${BRL(c.outros_custos)}</div></div>
    <div class="kpi blue"><div class="lab">Custo total</div><div class="val">${BRL(c.custo_total)}</div></div>
  </div>
  <div class="card"><div class="card-h"><h3>Itens e rateio</h3>
    <span class="tag n">rateio por ${c.criterio_rateio === 'VALOR' ? 'valor' : 'quantidade'}</span>
    <button class="btn btn-s btn-sm" id="prBtn">🖨 Imprimir</button></div>
    <div class="tw"><table class="dt"><thead><tr>
      <th>Produto</th><th class="r">Qtd</th><th class="r">Valor unit.</th><th class="r">Subtotal</th>
      <th class="r">Rateio</th><th class="r">Custo do item</th><th class="r">Custo unitário final</th></tr></thead><tbody>
    ${c.compra_itens.map(i => `<tr>
      <td><a href="#produtos/${i.produto_id}"><b>${esc(i.produtos?.nome)}</b></a>
        <span style="color:var(--mute);font-size:11.5px;display:block" class="num">${esc(i.produtos?.codigo)}</span></td>
      <td class="r">${QTD(i.quantidade)}</td><td class="r money">${BRL(i.valor_unitario)}</td>
      <td class="r money">${BRL(i.subtotal)}</td><td class="r money" style="color:var(--amber)">${BRL(i.rateio_acessorio)}</td>
      <td class="r money">${BRL(i.custo_total_item)}</td>
      <td class="r money"><b>${BRL(i.custo_unitario_final)}</b></td></tr>`).join('')}
    </tbody><tfoot><tr style="background:#fbfcfe;font-weight:700">
      <td colspan="3">Total</td><td class="r money">${BRL(c.subtotal_produtos)}</td>
      <td class="r money">${BRL(c.custo_acessorio)}</td><td class="r money">${BRL(c.custo_total)}</td><td></td></tr></tfoot>
    </table></div>
    <div class="pager"><span>A soma dos rateios (${BRL(c.compra_itens.reduce((a, i) => a + N(i.rateio_acessorio), 0))})
      confere exatamente com os custos acessórios (${BRL(c.custo_acessorio)}) ✓</span></div></div>
  ${c.observacoes ? `<div class="card"><div class="card-b"><b style="font-size:12px;color:var(--mute)">OBSERVAÇÕES</b>
    <p style="margin-top:6px">${esc(c.observacoes)}</p></div></div>` : ''}`;

  $('#prBtn').onclick = () => imprimir(docCompra(c));
  const cb = $('#canBtn');
  if (cb) cb.onclick = async () => {
    const motivo = await confirmar({ titulo:`Cancelar compra nº ${c.numero}`, pedirMotivo:true, textoBotao:'Cancelar compra',
      mensagem:'Esta operação vai <b>devolver os produtos</b> ao fornecedor no sistema, retirando-os do estoque.',
      detalhes:'O custo médio dos produtos será recalculado. Se alguma unidade já foi vendida, o cancelamento será bloqueado.' });
    if (!motivo) return;
    try { await rpc('fn_cancelar_compra', { p_compra_id: c.id, p_motivo: motivo });
          ok('Compra cancelada', 'Estoque e custo médio revertidos.'); navegar(); }
    catch (e) { bad('Não foi possível cancelar', erroAmigavel(e)); }
  };
}

ROTAS.estoque = async (v) => {

    q(sb.from('vw_produtos').select('*').order('nome')),
    q(sb.from('vw_kardex').select('*').order('data_movimento', { ascending:false }).order('created_at', { ascending:false }).limit(300))

  const t = (f) => prods.reduce((a, p) => a + N(p[f]), 0);
  const TIPOS = { ENTRADA_COMPRA:'Entrada por compra', SAIDA_VENDA:'Venda', SAIDA_REMESSA:'Envio a revendedor',
    RETORNO_DEVOLUCAO:'Devolução', BAIXA_VENDA_CONSIGNADA:'Venda em consignação', BAIXA_PERDA:'Perda',
    RESERVA:'Reserva', LIBERACAO_RESERVA:'Liberação', AJUSTE_POSITIVO:'Ajuste (entrada)',

  v.innerHTML = `
  <div class="page-head"><h1>Estoque<small>Posição em ${agoraBR()}</small></h1>
    <div class="acts"><button class="btn btn-s btn-sm" id="expBtn">📊 Excel</button>

  <div class="kpis k5">
    <div class="kpi blue"><div class="lab">Disponível</div><div class="val">${BRL(t('valor_estoque_disponivel'))}</div>
      <div class="sub">${QTD(t('qtd_disponivel'))} unidades</div></div>
    <div class="kpi amber"><div class="lab">Mostruário</div><div class="val">${BRL(t('valor_mostruario'))}</div>
      <div class="sub">${QTD(t('qtd_mostruario'))} unidades</div></div>
    <div class="kpi violet"><div class="lab">Consignado</div><div class="val">${BRL(t('valor_consignado'))}</div>
      <div class="sub">${QTD(t('qtd_consignado'))} unidades</div></div>
    <div class="kpi"><div class="lab">Investimento total</div><div class="val">${BRL(t('valor_total_custo'))}</div></div>
    <div class="kpi green"><div class="lab">Lucro potencial</div>
      <div class="val">${BRL(t('valor_potencial_venda') - t('valor_total_custo'))}</div></div>
  </div>
  <div class="tabs"><button class="on" data-t="pos">Posição por produto</button>
    <button data-t="kx">Movimentações</button></div>

  <div class="card" data-p="pos"><div class="filters">
      <input class="inp grow" id="fq" placeholder="🔍 Buscar produto…">
      <select class="inp" id="fcat"><option value="">Todas as categorias</option>${selectOpts(S.categorias)}</select>
      <label class="chk"><input type="checkbox" id="fsaldo" checked> Só com saldo</label>
      <label class="chk"><input type="checkbox" id="fbaixo"> Estoque baixo</label></div>
    <div class="tw"><table class="dt"><thead><tr>
      <th>Produto</th><th class="c">Disponível</th><th class="c">Reservado</th><th class="c">Mostruário</th>
      <th class="c">Consignado</th><th class="c">Total</th><th class="r">Custo médio</th>
      <th class="r">Valor total</th></tr></thead><tbody id="tb"></tbody></table></div>
    <div class="pager"><span id="cnt"></span></div></div>

  <div class="card" data-p="kx" style="display:none"><div class="filters">
      <input class="inp grow" id="kq" placeholder="🔍 Buscar produto…">
      <select class="inp" id="ktipo"><option value="">Todos os tipos</option>
        ${Object.entries(TIPOS).map(([k, x]) => `<option value="${k}">${x}</option>`).join('')}</select></div>
    <div class="tw"><table class="dt"><thead><tr>
      <th>Data</th><th>Produto</th><th>Tipo</th><th>Bolso</th><th class="r">Entrada</th><th class="r">Saída</th>

          sal = $('#fsaldo').checked, bx = $('#fbaixo').checked;
    const f = prods.filter(p => (!t2 || (p.nome + ' ' + p.codigo).toLowerCase().includes(t2)) &&

    $('#cnt').textContent = `${f.length} produto(s)`;
    $('#tb').innerHTML = f.length ? f.map(p => `<tr>
      <td><a href="#produtos/${p.id}" class="pnome"><div class="ph">🌸</div><div style="min-width:0">
        <b>${esc(p.nome)}</b><span>${esc(p.codigo)}</span></div></a></td>
      <td class="c"><b class="${p.estoque_baixo ? 'neg' : ''}">${QTD(p.qtd_disponivel)}</b></td>
      <td class="c">${N(p.qtd_reservado) ? QTD(p.qtd_reservado) : '—'}</td>
      <td class="c">${N(p.qtd_mostruario) ? QTD(p.qtd_mostruario) : '—'}</td>
      <td class="c">${N(p.qtd_consignado) ? QTD(p.qtd_consignado) : '—'}</td>
      <td class="c"><b>${QTD(p.qtd_total)}</b></td>

      : `<tr><td colspan="8">${vazio('🗃️','Nenhum produto','Ajuste os filtros ou registre uma compra.')}</td></tr>`;

  const pintarK = () => {
    const t2 = $('#kq').value.trim().toLowerCase(), tp = $('#ktipo').value;
    const f = movs.filter(m => (!t2 || (m.produto_nome + ' ' + m.produto_codigo).toLowerCase().includes(t2)) && (!tp || m.tipo === tp));
    $('#kcnt').textContent = `${f.length} movimentação(ões)`;
    $('#ktb').innerHTML = f.length ? f.map(m => `<tr style="${m.e_estorno ? 'font-style:italic;color:var(--mute)' : ''}">

      <td><a href="#produtos/${m.produto_id}">${esc(m.produto_nome)}</a></td>
