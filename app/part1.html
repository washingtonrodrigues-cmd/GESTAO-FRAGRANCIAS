<!-- Geração de .xlsx (opcional). Se não carregar, a exportação cai para CSV automaticamente. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" onerror="window.__semXLSX=1"></script>
<style>
:root{
  --brand:#4338ca; --brand-600:#4f46e5; --brand-50:#eef2ff; --brand-100:#e0e7ff;
  --ink:#0f172a; --ink-2:#334155; --mute:#64748b; --mute-2:#94a3b8;
  --line:#e2e8f0; --line-2:#cbd5e1; --bg:#f6f7fb; --card:#ffffff;
  --green:#059669; --green-bg:#ecfdf5; --red:#dc2626; --red-bg:#fef2f2;
  --amber:#d97706; --amber-bg:#fffbeb; --blue:#0284c7; --blue-bg:#f0f9ff;
  --violet:#7c3aed; --violet-bg:#f5f3ff;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  /* Marca ESSENZA AURA */
  --marca-preto:#0d0d0d; --marca-ouro:#b08a52; --marca-ouro-claro:#d4b083;
  --sh:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
  --sh-lg:0 10px 30px -8px rgba(15,23,42,.18);
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--brand);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ══ LOGIN ══ */
#login{position:fixed;inset:0;display:grid;place-items:center;background:
  radial-gradient(ellipse 100% 70% at 50% 0%,#ede9fe,transparent 70%),var(--bg);z-index:200}
.login-card{width:min(400px,92vw);background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:38px 34px;box-shadow:var(--sh-lg)}
.login-card{text-align:left}
.login-card .logo-marca{display:block;width:170px;margin:0 auto 20px;border-radius:10px}
.login-card p.sub{color:var(--mute);font-size:13.5px;margin-bottom:26px;text-align:center}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;background:#fff;
  transition:border-color .15s,box-shadow .15s;font-size:14px}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.inp:disabled{background:#f8fafc;color:var(--mute)}
textarea.inp{resize:vertical;min-height:64px}
.btn{border:1px solid transparent;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13.5px;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center;
  transition:background .15s,border-color .15s,opacity .15s;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-p{background:var(--brand);color:#fff}.btn-p:hover:not(:disabled){background:var(--brand-600)}
.btn-s{background:#fff;border-color:var(--line-2);color:var(--ink-2)}.btn-s:hover:not(:disabled){background:#f8fafc;border-color:var(--mute-2)}
.btn-d{background:var(--red);color:#fff}.btn-d:hover:not(:disabled){background:#b91c1c}
.btn-g{background:var(--green);color:#fff}.btn-g:hover:not(:disabled){background:#047857}
.btn-ghost{background:transparent;color:var(--mute)}.btn-ghost:hover{background:#f1f5f9;color:var(--ink)}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-block{width:100%}
.err{background:var(--red-bg);border:1px solid #fecaca;color:#991b1b;padding:10px 13px;
  border-radius:8px;font-size:13px;margin-bottom:15px}

/* ══ SHELL ══ */
#app{display:none;min-height:100vh}
#app.on{display:block}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:236px;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:60;transition:transform .25s}
.sb-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sb-head .mark{width:36px;height:36px;border-radius:8px;flex:0 0 auto;object-fit:cover}
.sb-head .nm{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.09em;line-height:1.1;
  color:var(--marca-preto)}
.sb-head .sb{font-size:8.5px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;
  margin-top:3px;line-height:1.35}
.sb-nav{flex:1;overflow-y:auto;padding:12px 10px 20px}
.sb-grp{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute-2);
  padding:14px 10px 6px}
.sb-nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);
  font-size:13.5px;font-weight:500;margin-bottom:1px;transition:background .12s,color .12s}
.sb-nav a:hover{background:#f1f5f9;color:var(--ink)}
.sb-nav a.on{background:var(--brand-50);color:var(--brand);font-weight:600}
.sb-nav a .ic{width:17px;text-align:center;flex:0 0 auto;opacity:.85}
.sb-nav a .bdg{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;
  padding:1px 6px;border-radius:9px;font-family:var(--mono)}
.sb-foot{border-top:1px solid var(--line);padding:11px 14px;display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand-100);color:var(--brand);
  display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 auto}
.sb-foot .u{flex:1;min-width:0}
.sb-foot .u b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-foot .u span{font-size:11px;color:var(--mute)}

.main{margin-left:236px;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:0 24px;height:56px;display:flex;align-items:center;gap:14px;z-index:40}
.topbar .crumb{font-size:13px;color:var(--mute);flex:1;min-width:0}
.topbar .crumb b{color:var(--ink);font-weight:600}
.menu-btn{display:none;background:none;border:none;font-size:19px;cursor:pointer;color:var(--ink-2);padding:4px}
.tb-user{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.tb-user .nm{font-size:12.5px;color:var(--mute);max-width:170px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
@media(max-width:860px){.tb-user .nm{display:none}}
.search-glob{position:relative;width:270px}
.search-glob input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 11px 7px 32px;
  background:#f8fafc;font-size:13px}
.search-glob input:focus{outline:none;background:#fff;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.search-glob .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mute-2);font-size:13px}
.gres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--sh-lg);max-height:340px;overflow-y:auto;display:none;z-index:50}
/* Lista de sugestões flutuante: presa ao <body> e com position:fixed para não
   ser recortada por nenhum contêiner com overflow (as tabelas de itens usam
   overflow-x:auto, o que escondia a lista dentro do formulário). */
.gres.flut{position:fixed;top:auto;left:auto;right:auto;z-index:180;max-height:300px;min-width:250px}
.gres .criar{background:var(--brand-50);color:var(--brand);font-weight:600;border-top:1px solid var(--line)}
.gres .criar:hover{background:var(--brand-100)}
.gres .vazio{color:var(--mute);cursor:default}
.gres.on{display:block}
.gres a{display:block;padding:9px 13px;border-bottom:1px solid #f1f5f9;color:var(--ink);font-size:13px}
.gres a:last-child{border-bottom:none}
.gres a:hover{background:var(--brand-50)}
.gres .t{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

.content{flex:1;padding:24px;max-width:1500px;width:100%}
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:170px}
.page-head h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:3px;letter-spacing:0}
.page-head .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ══ CARDS / KPI ══ */
.kpis{display:grid;gap:12px;margin-bottom:20px}
.k5{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.k4{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.k3{grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--sh)}
.kpi .lab{font-size:11.5px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;
  margin-bottom:7px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:22px;font-weight:700;letter-spacing:-.02em;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--mute);margin-top:4px}
.kpi.green .val{color:var(--green)} .kpi.red .val{color:var(--red)}
.kpi.amber .val{color:var(--amber)} .kpi.blue .val{color:var(--blue)}
.kpi.violet .val{color:var(--violet)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px;overflow:hidden}
.card-h{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.card-h h3{font-size:14.5px;font-weight:700;flex:1;min-width:130px;letter-spacing:-.01em}
.card-b{padding:17px}
.card-b.flush{padding:0}

/* ══ TABLE ══ */
.tw{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{text-align:left;padding:10px 13px;font-size:11px;font-weight:700;color:var(--mute);
  text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);white-space:nowrap;
  background:#fbfcfe;position:sticky;top:0;z-index:1}
table.dt td{padding:11px 13px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
table.dt tbody tr:hover{background:#fafbff}
table.dt tbody tr:last-child td{border-bottom:none}
table.dt .r{text-align:right}
table.dt .c{text-align:center}
table.dt .nw{white-space:nowrap}
.empty{padding:48px 20px;text-align:center;color:var(--mute)}
.empty .ic{font-size:34px;margin-bottom:10px;opacity:.35}
.empty h4{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.empty p{font-size:13px;margin-bottom:16px}

.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.g{background:var(--green-bg);color:var(--green)}
.tag.r{background:var(--red-bg);color:var(--red)}
.tag.a{background:var(--amber-bg);color:var(--amber)}
.tag.b{background:var(--blue-bg);color:var(--blue)}
.tag.v{background:var(--violet-bg);color:var(--violet)}
.tag.n{background:#f1f5f9;color:var(--mute)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}

.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:13px 17px;border-bottom:1px solid var(--line);background:#fbfcfe}
.filters .inp{width:auto;min-width:130px;padding:7px 10px;font-size:13px}
.filters .grow{flex:1;min-width:180px}
.pager{display:flex;align-items:center;gap:11px;padding:11px 17px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.pager .sp{flex:1}

/* ══ FORM ══ */
.grid-f{display:grid;gap:14px}
.f2{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.f3{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.f4{grid-template-columns:repeat(auto-fit,minmax(125px,1fr))}
.hint{font-size:11.5px;color:var(--mute);margin-top:4px}
.hint.warn{color:var(--amber);font-weight:600}
.hint.bad{color:var(--red);font-weight:600}
.sec-t{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);
  margin:22px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.sec-t:first-child{margin-top:0}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;user-select:none}
.chk input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}

/* ══ MODAL ══ */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:26px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:min(720px,100%);box-shadow:var(--sh-lg);
  animation:pop .2s cubic-bezier(.2,.8,.3,1);margin:auto}
.modal.wide{width:min(1080px,100%)}
.modal.narrow{width:min(440px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
.modal-h{padding:17px 21px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.modal-h h3{font-size:16.5px;font-weight:700;flex:1;letter-spacing:-.01em}
.modal-h .x{background:none;border:none;font-size:20px;cursor:pointer;color:var(--mute-2);line-height:1;padding:2px 6px}
.modal-h .x:hover{color:var(--ink)}
.modal-b{padding:21px;max-height:calc(100vh - 210px);overflow-y:auto}
.modal-f{padding:15px 21px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;
  flex-wrap:wrap;background:#fbfcfe;border-radius:0 0 14px 14px}
.modal-f .sp{flex:1}

/* ══ TOAST ══ */
#toasts{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:9px;max-width:min(400px,92vw)}
.toast{background:#fff;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:9px;
  padding:12px 15px;box-shadow:var(--sh-lg);animation:slide .25s;font-size:13.5px}
.toast.ok{border-left-color:var(--green)} .toast.bad{border-left-color:var(--red)} .toast.warn{border-left-color:var(--amber)}
.toast b{display:block;font-weight:700;margin-bottom:2px;font-size:13.5px}
.toast span{color:var(--mute);font-size:12.5px}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* ══ MISC ══ */
.spin{width:17px;height:17px;border:2px solid var(--line-2);border-top-color:var(--brand);
  border-radius:50%;animation:sp .65s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:56px;text-align:center;color:var(--mute)}
.skel{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;
  animation:shm 1.3s infinite;border-radius:6px;height:15px}
@keyframes shm{0%{background-position:200% 0}100%{background-position:-200% 0}}
.bar{height:6px;background:#f1f5f9;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--green)} .neg{color:var(--red)}
.thumb{width:34px;height:34px;border-radius:7px;object-fit:cover;background:#f1f5f9;flex:0 0 auto}
.pnome{display:flex;align-items:center;gap:9px;min-width:0}
.pnome .ph{width:34px;height:34px;border-radius:7px;background:var(--marca-preto);display:grid;place-items:center;
  font-size:13px;color:var(--marca-ouro-claro);font-family:var(--serif);font-weight:600;flex:0 0 auto}
.pnome b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnome span{font-size:11.5px;color:var(--mute);font-family:var(--mono)}
.alert{padding:12px 15px;border-radius:9px;font-size:13px;margin-bottom:15px;display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:var(--amber-bg);border:1px solid #fde68a;color:#92400e}
.alert.bad{background:var(--red-bg);border:1px solid #fecaca;color:#991b1b}
.alert.info{background:var(--blue-bg);border:1px solid #bae6fd;color:#075985}
.alert.ok{background:var(--green-bg);border:1px solid #a7f3d0;color:#065f46}
.alert b{font-weight:700}
.sumbox{background:#fbfcfe;border:1px solid var(--line);border-radius:9px;padding:15px}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13.5px}
.sumrow.tot{border-top:1px solid var(--line-2);margin-top:7px;padding-top:11px;font-weight:700;font-size:15.5px}
.sumrow .l{color:var(--mute)} .sumrow.tot .l{color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:17px;overflow-x:auto}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:9px 14px;
  font-size:13.5px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.chart{width:100%;height:230px}
.lgd{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:9px;justify-content:center}
.lgd i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
.rank{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #f1f5f9}
.rank:last-child{border-bottom:none}
.rank .pos-n{width:22px;height:22px;border-radius:6px;background:#f1f5f9;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--mute);flex:0 0 auto}
.rank .pos-n.top{background:var(--brand);color:#fff}
.rank .info{flex:1;min-width:0}
.rank .info b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .info span{font-size:11.5px;color:var(--mute)}
.itens-tb{width:100%;border-collapse:collapse;font-size:13px}
.itens-tb th{text-align:left;padding:7px 9px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--mute);font-weight:700;border-bottom:1px solid var(--line)}
.itens-tb td{padding:6px 9px;border-bottom:1px solid #f1f5f9}
.itens-tb .inp{padding:6px 8px;font-size:13px}
.itens-tb tfoot td{border-bottom:none;padding-top:11px;font-weight:700}

@media(max-width:1000px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:var(--sh-lg)}
  .main{margin-left:0}
  .menu-btn{display:block}
  .search-glob{width:auto;flex:1;max-width:230px}
  .content{padding:16px}
}
@media(max-width:640px){
  .kpi .val{font-size:19px}
  .modal-b{padding:16px}
  .topbar{padding:0 14px}
  .topbar .crumb{display:none}
}

/* ══ IMPRESSÃO / PDF ══ */
#printarea{display:none}
@media print{
  @page{size:A4;margin:11mm}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  body{background:#fff}
  #app,#login,#toasts,.ov{display:none !important}
  #printarea{display:block !important}
  .doc{page-break-after:always}
  .doc:last-child{page-break-after:auto}
}
/* ══ DOCUMENTOS IMPRESSOS — identidade ESSENZA AURA ══ */
.doc{font-family:var(--sans);color:#16130f;font-size:11px;max-width:186mm;margin:0 auto;line-height:1.5}

.doc .dh{display:flex;align-items:stretch;gap:10mm;padding-bottom:6mm;margin-bottom:7mm;
  border-bottom:2.5px solid var(--marca-preto)}
.doc .dh .co{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.doc .dh .co .marca{width:46mm;display:block;border-radius:2mm}
.doc .dh .co p{font-size:9.5px;color:#5a5348;line-height:1.55;margin-top:3mm}
.doc .dh .no{text-align:right;flex:0 0 auto;padding-left:8mm;border-left:1px solid #d8d0c4;align-self:stretch;
  display:flex;flex-direction:column;justify-content:center}
.doc .dh .no h3{font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--marca-preto);line-height:1.2}
.doc .dh .no .num{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--marca-ouro);margin-top:1.5mm}
.doc .dh .no .dt{font-size:9.5px;color:#5a5348;margin-top:1mm}
.doc .dh .no .et{display:inline-block;margin-top:2mm;font-size:7.5px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700;border:1px solid var(--marca-ouro);color:var(--marca-ouro);
  padding:1mm 2.5mm;border-radius:1mm}

.doc h4{font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--marca-ouro);
  margin:6mm 0 2mm;display:flex;align-items:center;gap:3mm}
.doc h4::after{content:'';flex:1;height:1px;background:#e2dbcf}
.doc h4:first-of-type{margin-top:0}

.doc .pessoa{background:#faf8f4;border-left:2.5px solid var(--marca-ouro);padding:3mm 4mm;border-radius:0 1.5mm 1.5mm 0}
.doc .pessoa b{font-size:12.5px;font-weight:700;display:block;margin-bottom:1mm}
.doc .pessoa span{font-size:9.5px;color:#5a5348;display:block;line-height:1.6}

.doc table{width:100%;border-collapse:collapse;font-size:10.5px}
.doc table th{text-align:left;padding:2.5mm 2mm;border-bottom:1.5px solid var(--marca-preto);
  font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#3d382f}
.doc table td{padding:2.5mm 2mm;border-bottom:1px solid #eae5db}
.doc table tbody tr:last-child td{border-bottom:1px solid #d8d0c4}
.doc table .r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.doc table .c{text-align:center}
.doc table .prod b{font-weight:600}
.doc table .prod span{display:block;font-size:8.5px;color:#8a8175;font-family:var(--mono)}
.doc table tfoot td{border-bottom:none;font-weight:700;padding-top:3mm}
.doc table tr.sub td{font-weight:700;color:#16130f;background:#faf7f2}

.doc .tot{margin-top:4mm;margin-left:auto;width:72mm}
.doc .tot .l{display:flex;justify-content:space-between;gap:6mm;padding:1.2mm 0;font-size:10.5px;color:#4a453c}
.doc .tot .l span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.doc .tot .l.big{margin-top:2.5mm;padding:3mm 4mm;background:var(--marca-preto);color:#fff;
  border-radius:1.5mm;font-size:13px;font-weight:700;letter-spacing:.02em}
.doc .tot .l.big span:last-child{color:var(--marca-ouro-claro)}
.doc .tot .l.sub{border-top:1px solid #d8d0c4;margin-top:1.5mm;padding-top:2mm;font-weight:600;color:#16130f}

.doc .grid2{display:flex;gap:6mm}
.doc .grid2 > *{flex:1}
.doc .caixa{border:1px solid #e2dbcf;border-radius:2mm;padding:3mm 4mm}
.doc .caixa .k{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#8a8175;font-weight:700}
.doc .caixa .v{font-family:var(--mono);font-size:12px;font-weight:600;margin-top:1mm}

.doc .sig{margin-top:16mm;display:flex;gap:14mm;justify-content:space-around;text-align:center;font-size:9.5px}
.doc .sig div{flex:1;border-top:1px solid var(--marca-preto);padding-top:2mm;max-width:70mm;color:#4a453c}
.doc .sig div b{display:block;font-size:10.5px;color:#16130f;font-weight:600}

.doc .termo{margin-top:6mm;padding:3.5mm 4mm;border:1px solid var(--marca-ouro);border-radius:2mm;
  background:#fdfbf7;font-size:9px;line-height:1.65;color:#4a453c}
.doc .termo b{display:block;font-size:8px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--marca-ouro);margin-bottom:1.5mm}

.doc .ft{margin-top:9mm;padding-top:2.5mm;border-top:1px solid #e2dbcf;font-size:8px;color:#9a9185;
  display:flex;justify-content:space-between;align-items:center;gap:6mm}
.doc .ft .slogan{font-family:var(--serif);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--marca-ouro)}
.doc .aviso{margin-top:4mm;padding:2.5mm 3.5mm;background:#fdf4f4;border-left:2.5px solid #c0392b;
  font-size:9px;color:#8a2f24;border-radius:0 1.5mm 1.5mm 0}

</style>

<body>
